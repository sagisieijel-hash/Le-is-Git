<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WATTcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="screen" id="app" data-view="login">

    <section class="intro">
    <!-- Logo -->
    <svg class="logo" viewBox="0 0 80 48" aria-hidden="true">
      <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
        <line x1="27" y1="14" x2="39" y2="14"/>
        <line x1="25" y1="24" x2="39" y2="24"/>
        <line x1="27" y1="34" x2="39" y2="34"/>
      </g>
      <path d="M58 4 44 26h9l-4 18 16-24h-10l5-16z" fill="#fff"/>
      <g fill="#F0612B">
        <circle cx="8"  cy="12" r="2.2"/>
        <circle cx="15" cy="6"  r="1.6"/>
        <circle cx="12" cy="22" r="1.8"/>
        <circle cx="19" cy="17" r="1.4"/>
      </g>
    </svg>

    <h1 class="brand">WATTcher</h1>
    <h2 class="headline" id="headline">Welcome Back!</h2>
    <p class="sub" id="sub">Log in to access your energy usage, device readings and saved reports.</p>

    </section>

    <section class="panel">
    <!-- Login / Sign in toggle -->
    <div class="tabs" role="tablist" aria-label="Account">
      <button class="tab is-active" role="tab" id="tab-login" aria-selected="true" data-target="login">Login</button>
      <button class="tab" role="tab" id="tab-signin" aria-selected="false" data-target="signin">Sign In</button>
    </div>

    <!-- Login / Sign in form -->
    <form class="card" id="auth-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username">
        <p class="error" id="username-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
        <p class="error" id="password-error" role="alert"></p>
      </div>

      <button type="button" class="link link--right" id="forgot-link">Forgot Password</button>

      <button type="submit" class="link link--center" id="auth-submit">Login</button>
    </form>

    <!-- Forgot password form -->
    <form class="card card--forgot" id="forgot-form" novalidate hidden>
      <div class="field">
        <label for="new-password">Change Password</label>
        <input type="password" id="new-password" name="new-password" autocomplete="new-password">
        <p class="error" id="new-password-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="confirm-password">New Password</label>
        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password">
        <p class="error" id="confirm-password-error" role="alert"></p>
      </div>

      <button type="submit" class="link link--center">Submit</button>
    </form>

    <button type="button" class="link back" id="back-link" hidden>Back to login</button>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
